COSA SONO I COOKIE E LE TECNOLOGIE SIMILI
I cookie e altre tecnologie di memorizzazione possono conservare alcune informazioni nel dispositivo durante la navigazione.

COSA USA MANILA DARK LAB
Il sito utilizza la memoria locale del browser (localStorage) per conservare il carrello e alcune preferenze di navigazione, evitando di perdere le scelte tra una pagina e l'altra. La memorizzazione del carrello non è usata per profilazione pubblicitaria. Puoi cancellarla dalle impostazioni del browser.

In questa configurazione non risultano integrati Google Analytics, Meta Pixel o strumenti pubblicitari di profilazione. I servizi tecnici di hosting possono utilizzare dati di connessione necessari al funzionamento e alla sicurezza.

SERVIZI DI TERZE PARTI
Aprendo Instagram o WhatsApp esci dal sito e accedi ai rispettivi servizi, che applicano proprie regole e tecnologie.

CONSENSO
Per le sole tecnologie tecniche strettamente necessarie, in generale non è richiesto un banner di consenso. Se verranno aggiunti strumenti analitici non esenti, profilazione o pubblicità, sarà predisposto un sistema di consenso preventivo con opzioni di scelta e revoca.
