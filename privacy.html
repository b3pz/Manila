TITOLARE E CONTATTI
Il titolare del trattamento è Manila Colaci, per il progetto Manila Dark Lab.
Contatto per richieste privacy: maniladarklab@gmail.com.

QUALI DATI TRATTIAMO E PERCHÉ
Se ci scrivi via email o WhatsApp, trattiamo i dati che scegli di comunicarci (ad esempio nome, recapito, messaggio e prodotti richiesti) per risponderti e gestire la tua richiesta. La base giuridica è l'esecuzione di misure precontrattuali richieste dall'interessato oppure, per comunicazioni generiche, il legittimo interesse a rispondere ai contatti ricevuti.

Il sito mostra un catalogo e consente di creare una lista di articoli nel browser. Il carrello viene conservato localmente sul tuo dispositivo; non equivale alla conclusione di un ordine. Non sono attualmente attivi pagamenti online.

Durante la visita, i fornitori tecnici di hosting e infrastruttura possono trattare indirizzo IP e dati tecnici necessari per distribuire le pagine, prevenire abusi e mantenere il servizio. Per immagini e dati del catalogo il sito usa servizi di hosting e database esterni, tra cui GitHub Pages e Supabase.

SERVIZI ESTERNI
I link a Instagram e WhatsApp portano a servizi gestiti da Meta: quando li utilizzi, possono applicarsi le loro informative. Non condividiamo automaticamente il contenuto del carrello con WhatsApp: viene trasferito solo quando scegli di inviare una richiesta.

CONSERVAZIONE E DESTINATARI
Le richieste vengono conservate per il tempo necessario a gestirle e per eventuali obblighi di legge. Possono accedervi il titolare e i fornitori tecnici strettamente necessari. L'eventuale trasferimento di dati fuori dallo Spazio Economico Europeo deve essere valutato rispetto ai fornitori concretamente impiegati.

DIRITTI
Puoi richiedere accesso, rettifica, cancellazione, limitazione, opposizione e, ove applicabile, portabilità scrivendo a maniladarklab@gmail.com. Puoi inoltre presentare reclamo al Garante per la protezione dei dati personali.

Questa informativa riguarda il sito nella sua configurazione attuale, come vetrina in preparazione. Prima di attivare pagamenti online, newsletter, strumenti pubblicitari o altri servizi, il testo dovrà essere aggiornato e verificato.</script></body></html>
